# The USA SC03/0002 actor dispatcher calls the first Fores conversation
# entry at 0x801CBB54 and the re-entry at 0x801CBBDC. The four callbacks
# occupy file offsets [0x804, 0x8F8) in member 0056. The word at 0x800
# precedes executable code and the first conversation data follows at 0x8F8.
name: sc03_0056
sha1: 5dbf20806eb4724aa8f57f97a4376c2c217ec418

options:
  platform: psx
  basename: sc03_0056
  base_path: ../
  target_path: extracted/overlays/sc03/0056.bin
  asm_path: asm/overlays/sc03_0056
  src_path: src/overlays/sc03_0056
  build_path: build
  ld_script_path: config/sc03_0056.ld
  symbol_addrs_path:
    - config/symbol_addrs.sc03_0056.auto.txt
    - config/symbol_addrs.sc03_0056.txt
  undefined_syms_auto_path: config/undefined_syms.sc03_0056.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.sc03_0056.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: sc03_0056
    type: code
    start: 0x0
    vram: 0x801CB350
    subsegments:
      - [0x0, data, sc03_0056_container]
      - [0x800, data, sc03_0056_hdr]
      - [0x804, asm, sc03_0056]
      - [0x8F8, data, sc03_0056_tail]

  - [0x1800]
